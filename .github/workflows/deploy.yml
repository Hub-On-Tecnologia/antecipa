name: Deploy para VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependências
        run: npm ci

      - name: Build (Frontend Vite + Backend esbuild)
        run: npm run build

      - name: Envia arquivos compilados para o VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: ${{ secrets.VPS_PROJECT_PATH }}/dist/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Envia package.json e ecosystem para o VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: package.json package-lock.json ecosystem.config.cjs
          remote_path: ${{ secrets.VPS_PROJECT_PATH }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Instala deps de produção e reinicia PM2 no VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "--- Instalando dependências de produção ---"
            npm ci --omit=dev

            echo "--- Reiniciando aplicação no PM2 ---"
            pm2 restart antcp-hubon --update-env || pm2 start ecosystem.config.cjs

            echo "--- Deploy concluído! ---"
            pm2 status antcp-hubon
